---
layout: default
---
<h1>Myopia to Clarity</h1>
<p class="home-tagline">Know thyself</p>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
    <span class="post-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></span>
  </li>
  {% endfor %}
</ul>
