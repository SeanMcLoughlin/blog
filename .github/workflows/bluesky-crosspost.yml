name: Bluesky Cross-post

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'

jobs:
  crosspost:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Cross-post to Bluesky
        run: node .github/scripts/crosspost.js
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BEFORE_SHA: ${{ github.event.before }}

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/bluesky_posts.json
          git diff --staged --quiet || git commit -m "Update Bluesky cross-post state [skip ci]" && git push
